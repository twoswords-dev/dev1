{{- if .Values.CACertificateConfigMap }}
{{/* Bundles local/internal CAs for components that call Keycloak and OpenSearch over HTTPS. */}}
{{- $bundle := .Files.Get "ca-certificates" }}
{{- if $bundle }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.CACertificateConfigMap }}
data:
  ca.crt: |-
{{ $bundle | indent 4 }}
{{- end }}
{{- end }}
