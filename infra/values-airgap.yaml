# Airgapped production profile for a 10-node k3s cluster (*.internal.au).
imagePullSecrets:
- name: airgap-registry
tolerations: []
affinity: {}
podAnnotations: {}
certManager:
  enabled: true
  selfSigned: true
  selfSignedIssuerName: azul-infra-selfsigned
  caCertificateName: azul-infra-ca
  caSecretName: azul-infra-ca
  issuerName: azul-infra-ca
  duration: 87600h0m0s
  renewBefore: 8760h0m0s
operators:
  strimzi:
    enabled: true
  opensearch:
    enabled: true
strimzi-operator:
  watchNamespaces:
  - azul-infra
  watchAnyNamespace: false
  labelsExclusionPattern: argocd.argoproj.io/instance
  replicas: 1
  generateNetworkPolicy: false
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 384Mi
      cpu: 500m
  image:
    registry: registry-1.docker.io
    repository: quay.io/strimzi
    tag: 1.0.0
  defaultImageRegistry: registry-1.docker.io
  defaultImageRepository: quay.io/strimzi
  imagePullSecrets:
  - name: airgap-registry
opensearch-operator:
  installCRDs: true
  manager:
    watchNamespace: azul-infra
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 384Mi
        cpu: 500m
    image:
      repository: registry-1.docker.io/opensearchproject/opensearch-operator
      tag: 3.0.0-alpha
      pullPolicy: IfNotPresent
    imagePullSecrets:
    - name: airgap-registry
  webhook:
    certManager:
      enabled: true
networkPolicy:
  enabled: false
istioEnabled: false
disableNetworkPolicies: []
customNetworkPolicies: []
minio:
  main:
    enable: true
    image: registry-1.docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    secretName: s3-keys
    replicas: 3
    resources:
      requests:
        memory: 4Gi
        cpu: 1000m
      limits:
        memory: 8Gi
        cpu: 4000m
    labels:
      app: s3-store-minio
      storage: minio-disk
      allow-ingress-minio: 'true'
      allow-connect-minio-cluster: 'true'
    storageClass: longhorn
    requests:
      storage: 5Ti
    ingress:
      api:
        enable: true
        host: minio-api.internal.au
      console:
        enable: true
        host: minio.internal.au
      ingressClassName: nginx
      secretName: minio-tls
      annotations:
        cert-manager.io/issuer: azul-infra-ca
        nginx.ingress.kubernetes.io/ssl-redirect: 'true'
  backup:
    enable: false
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    secretName: s3-backup-keys
    replicas: 1
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m
    labels:
      app: s3-store-minio-backup
      storage: minio-disk-backup
      allow-ingress-minio: 'true'
      allow-connect-minio-cluster: 'true'
    storageClass: longhorn
    requests:
      storage: 5Gi
    ingress:
      api:
        enable: true
        host: minio-backup-api.local
      console:
        enable: true
        host: minio-backup.local
      ingressClassName: nginx
      secretName: minio-backup-tls
      annotations:
        cert-manager.io/issuer: azul-infra-ca
        nginx.ingress.kubernetes.io/ssl-redirect: 'true'
opensearch:
  enable: true
  name: azul-opensearch
  harden: false
  general:
    version: 3.2.0
    replicas: 3
    setVMMaxMapCount: true
  nodes:
    diskSize: 2Ti
    resources:
      requests:
        memory: 12Gi
        cpu: 4000m
      limits:
        memory: 16Gi
        cpu: 8000m
    env:
    - name: cluster.initial_master_nodes
      value: azul-opensearch-nodes-0,azul-opensearch-nodes-1,azul-opensearch-nodes-2
    - name: discovery.seed_hosts
      value: azul-opensearch-nodes
    probes:
      startup:
        command:
        - /bin/bash
        - -c
        - curl -k --silent https://localhost:9200 >/dev/null
      readiness:
        command:
        - /bin/bash
        - -c
        - curl -k --silent https://localhost:9200 >/dev/null
  selfSigned: false
  issuerRef:
    name: azul-infra-ca
    kind: Issuer
  certificateSuffix: azul-infra.svc.cluster.local
  adminCredentialsSecret: azul-cluster-admincredentials
  dashboardCredentialsSecret: azul-cluster-dashboardcredentials
  additionalCerts: {}
  ingress:
    enable: false
    ingressClassName: default
    host: opensearch.azul.internal
    secretName: opensearch-tls
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: 'true'
      nginx.ingress.kubernetes.io/ssl-passthrough: 'true'
      nginx.ingress.kubernetes.io/proxy-body-size: 600m
      nginx.org/client-max-body-size: 600m
  dashboard:
    version: 3.2.0
    ingress:
      enable: true
      ingressClassName: nginx
      host: opensearch-dashboards.internal.au
      secretName: dashboard-ingress-tls
      annotations:
        cert-manager.io/issuer: azul-infra-ca
        nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    env:
    - name: OPENSEARCH_DASHBOARDS_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: opensearch-dashboards-oidc
          key: client-secret
    additionalVolumes:
    - name: additional-certs
      path: /usr/share/opensearch-dashboards/config/certs
      configMap:
        name: azul-opensearch-certs
      restartPods: true
    additionalConfig:
      opensearch_security.multitenancy.enabled: 'true'
      opensearch_security.multitenancy.tenants.preferred: '["Private", "Global"]'
      opensearch_security.readonly_mode.roles: '["kibana_read_only"]'
      server.name: azul-opensearch-dashboards
      server.host: 0.0.0.0
      server.rewriteBasePath: 'false'
      opensearch.ssl.verificationMode: certificate
      opensearch.ssl.certificateAuthorities: /usr/share/opensearch-dashboards/config/certs/ca-certificates
      opensearch.requestHeadersWhitelist: '["Authorization", "security_tenant", "securitytenant"]'
      opensearch_security.cookie.secure: 'true'
      opensearch_security.auth.type: openid
      opensearch_security.openid.scope: openid profile email offline_access roles
        azul
      opensearch_security.openid.connect_url: https://keycloak.azul-infra.svc.cluster.local/realms/azul/.well-known/openid-configuration
      opensearch_security.openid.client_id: opensearch-dashboards
      opensearch_security.openid.client_secret: ${OPENSEARCH_DASHBOARDS_CLIENT_SECRET}
      opensearch_security.openid.base_redirect_url: https://opensearch-dashboards.internal.au
      opensearch_security.openid.root_ca: /usr/share/opensearch-dashboards/config/certs/ca-certificates
    resources:
      requests:
        memory: 2Gi
        cpu: 500m
      limits:
        memory: 4Gi
        cpu: 2000m
  internalUsers:
    _meta:
      type: internalusers
      config_version: 2
    admin:
      reserved: true
      backend_roles:
      - admin
      description: admin user
    kibanaserver:
      reserved: true
    monitor:
      description: Exporter monitoring
    azul_writer:
      backend_roles:
      - azul_write
      description: Service account for metastore writer testing
  roleMapping:
    _meta:
      type: rolesmapping
      config_version: 2
    azul_read:
      reserved: false
      hidden: false
      backend_roles:
      - azul_read
      - azul_read_indirect
      - azul-access
      description: Maps azul_read role
    azul-fill1:
      reserved: false
      hidden: false
      backend_roles:
      - azul_read
      - azul-access
      description: fix SG 900D error
    azul-fill2:
      reserved: false
      hidden: false
      backend_roles:
      - azul_read
      - azul-access
      description: fix SG 900D error
    azul-fill3:
      reserved: false
      hidden: false
      backend_roles:
      - azul_read
      - azul-access
      description: fix SG 900D error
    azul-fill4:
      reserved: false
      hidden: false
      backend_roles:
      - azul_read
      - azul-access
      description: fix SG 900D error
    azul-fill5:
      reserved: false
      hidden: false
      backend_roles:
      - azul_read
      - azul-access
      description: fix SG 900D error
    s-any:
      reserved: false
      hidden: false
      backend_roles:
      - azul_read
      - azul-access
      description: Map
    s-official:
      reserved: false
      hidden: false
      backend_roles:
      - azul_read
      - azul-access
      description: Map
    azul_admin:
      reserved: false
      hidden: false
      backend_roles:
      - azul_admin
      description: Maps azul_admin role
    azul_write:
      reserved: false
      hidden: false
      backend_roles:
      - azul_write
      description: Maps azul_write role
    monitor:
      reserved: false
      hidden: false
      users:
      - monitor
      description: Maps monitor user to monitor role
    all_access:
      reserved: true
      backend_roles:
      - admin
      - opensearch-admins
      description: Maps admin to all_access
    readall:
      reserved: true
      backend_roles:
      - readall
    kibana_server:
      reserved: true
      users:
      - kibanaserver
    logstash:
      reserved: false
      backend_roles:
      - logstash
    kibana_user:
      reserved: false
      backend_roles:
      - kibanauser
      description: Maps kibanauser to kibana_user
    manage_snapshots:
      reserved: false
      backend_roles:
      - snapshotrestore
    s-tlp-clear:
      backend_roles:
      - azul_read
      - azul-access
    s-tlp-green:
      backend_roles:
      - azul_read
      - azul-access
    s-tlp-amber:
      backend_roles:
      - azul_read
      - azul-access
    s-tlp-amber-strict:
      backend_roles:
      - azul_read
      - azul-access
  roles:
    _meta:
      type: roles
      config_version: 2
    s-any:
      reserved: false
      hidden: false
      static: false
    s-official:
      reserved: false
      hidden: false
      static: false
    azul_read:
      reserved: false
      hidden: false
      static: false
      cluster_permissions:
      - indices:data/read/*
      - kibana_user
      index_permissions:
      - index_patterns:
        - '*'
        allowed_actions:
        - indices:admin/resolve/index
      - index_patterns:
        - azul.*
        allowed_actions:
        - indices:admin/get
        - indices:admin/analyze
      - index_patterns:
        - azul.x.*
        allowed_actions:
        - read
        dls: '{"bool": {"filter": [{"terms": {"encoded_security.inclusive": [${user.securityRoles}]}},
          {"terms_set": {"encoded_security.exclusive": {"terms": [${user.securityRoles}],
          "minimum_should_match_field": "encoded_security.num_exclusive"}}}]}}'
      - index_patterns:
        - azul.o.*
        allowed_actions:
        - read
      tenant_permissions:
      - tenant_patterns:
        - azul
        allowed_actions:
        - kibana_all_write
    azul-fill1:
      reserved: false
      hidden: false
      static: false
    azul-fill2:
      reserved: false
      hidden: false
      static: false
    azul-fill3:
      reserved: false
      hidden: false
      static: false
    azul-fill4:
      reserved: false
      hidden: false
      static: false
    azul-fill5:
      reserved: false
      hidden: false
      static: false
    azul_admin:
      reserved: false
      hidden: false
      static: false
      cluster_permissions:
      - cluster_monitor
      - cluster:admin/script/*
      - indices:admin/index_template/*
      - indices:admin/mapping/*
      - indices:admin/template/*
      - indices:data/read/*
      - indices:data/write/bulk
      - kibana_user
      index_permissions:
      - index_patterns:
        - azul.*
        allowed_actions:
        - unlimited
      - index_patterns:
        - virustotal*
        allowed_actions:
        - unlimited
      tenant_permissions:
      - tenant_patterns:
        - azul
        - global_tenant
        allowed_actions:
        - kibana_all_write
    azul_write:
      reserved: false
      hidden: false
      static: false
      cluster_permissions:
      - cluster_monitor
      - cluster:admin/script/*
      - indices:admin/index_template/*
      - indices:admin/mapping/*
      - indices:admin/template/*
      - indices:data/read/*
      - indices:data/write/bulk
      - kibana_user
      index_permissions:
      - index_patterns:
        - azul.*
        allowed_actions:
        - unlimited
    monitor:
      reserved: false
      hidden: false
      static: false
      cluster_permissions:
      - cluster_monitor
      index_permissions:
      - index_patterns:
        - '*'
        allowed_actions:
        - indices_monitor
    kibana_read_only:
      reserved: true
    security_rest_api_access:
      reserved: true
    alerting_read_access:
      reserved: true
      cluster_permissions:
      - cluster:admin/opendistro/alerting/alerts/get
      - cluster:admin/opendistro/alerting/destination/get
      - cluster:admin/opendistro/alerting/monitor/get
      - cluster:admin/opendistro/alerting/monitor/search
    alerting_ack_alerts:
      reserved: true
      cluster_permissions:
      - cluster:admin/opendistro/alerting/alerts/*
    alerting_full_access:
      reserved: true
      cluster_permissions:
      - cluster_monitor
      - cluster:admin/opendistro/alerting/*
      index_permissions:
      - index_patterns:
        - '*'
        allowed_actions:
        - indices_monitor
        - indices:admin/aliases/get
        - indices:admin/mappings/get
    anomaly_read_access:
      reserved: true
      cluster_permissions:
      - cluster:admin/opendistro/ad/detector/info
      - cluster:admin/opendistro/ad/detector/search
      - cluster:admin/opendistro/ad/detectors/get
      - cluster:admin/opendistro/ad/result/search
      - cluster:admin/opendistro/ad/tasks/search
    anomaly_full_access:
      reserved: true
      cluster_permissions:
      - cluster_monitor
      - cluster:admin/opendistro/ad/*
      index_permissions:
      - index_patterns:
        - '*'
        allowed_actions:
        - indices_monitor
        - indices:admin/aliases/get
        - indices:admin/mappings/get
    notebooks_read_access:
      reserved: true
      cluster_permissions:
      - cluster:admin/opendistro/notebooks/list
      - cluster:admin/opendistro/notebooks/get
    notebooks_full_access:
      reserved: true
      cluster_permissions:
      - cluster:admin/opendistro/notebooks/create
      - cluster:admin/opendistro/notebooks/update
      - cluster:admin/opendistro/notebooks/delete
      - cluster:admin/opendistro/notebooks/get
      - cluster:admin/opendistro/notebooks/list
    reports_instances_read_access:
      reserved: true
      cluster_permissions:
      - cluster:admin/opendistro/reports/instance/list
      - cluster:admin/opendistro/reports/instance/get
      - cluster:admin/opendistro/reports/menu/download
    reports_read_access:
      reserved: true
      cluster_permissions:
      - cluster:admin/opendistro/reports/definition/get
      - cluster:admin/opendistro/reports/definition/list
      - cluster:admin/opendistro/reports/instance/list
      - cluster:admin/opendistro/reports/instance/get
      - cluster:admin/opendistro/reports/menu/download
    reports_full_access:
      reserved: true
      cluster_permissions:
      - cluster:admin/opendistro/reports/definition/create
      - cluster:admin/opendistro/reports/definition/update
      - cluster:admin/opendistro/reports/definition/on_demand
      - cluster:admin/opendistro/reports/definition/delete
      - cluster:admin/opendistro/reports/definition/get
      - cluster:admin/opendistro/reports/definition/list
      - cluster:admin/opendistro/reports/instance/list
      - cluster:admin/opendistro/reports/instance/get
      - cluster:admin/opendistro/reports/menu/download
    asynchronous_search_full_access:
      reserved: true
      cluster_permissions:
      - cluster:admin/opendistro/asynchronous_search/*
      index_permissions:
      - index_patterns:
        - '*'
        allowed_actions:
        - indices:data/read/search*
    asynchronous_search_read_access:
      reserved: true
      cluster_permissions:
      - cluster:admin/opendistro/asynchronous_search/get
    index_management_full_access:
      reserved: true
      cluster_permissions:
      - cluster:admin/opendistro/ism/*
      - cluster:admin/opendistro/rollup/*
      - cluster:admin/opendistro/transform/*
      index_permissions:
      - index_patterns:
        - '*'
        allowed_actions:
        - indices:admin/opensearch/ism/*
    cross_cluster_replication_leader_full_access:
      reserved: true
      index_permissions:
      - index_patterns:
        - '*'
        allowed_actions:
        - indices:admin/plugins/replication/index/setup/validate
        - indices:data/read/plugins/replication/changes
        - indices:data/read/plugins/replication/file_chunk
    cross_cluster_replication_follower_full_access:
      reserved: true
      cluster_permissions:
      - cluster:admin/plugins/replication/autofollow/update
      index_permissions:
      - index_patterns:
        - '*'
        allowed_actions:
        - indices:admin/plugins/replication/index/setup/validate
        - indices:data/write/plugins/replication/changes
        - indices:admin/plugins/replication/index/start
        - indices:admin/plugins/replication/index/pause
        - indices:admin/plugins/replication/index/resume
        - indices:admin/plugins/replication/index/stop
        - indices:admin/plugins/replication/index/update
        - indices:admin/plugins/replication/index/status_check
  securityConfig:
    _meta:
      type: config
      config_version: 2
    config:
      dynamic:
        kibana:
          private_tenant_enabled: false
          multitenancy_enabled: true
          default_tenant: ''
          server_username: kibanaserver
          index: .kibana
          sign_in_options:
          - BASIC
          - OPENID
        authc:
          basic_internal_auth_domain:
            description: Authenticate via HTTP Basic against internal users database
            http_enabled: true
            transport_enabled: true
            order: 0
            http_authenticator:
              type: basic
              challenge: false
            authentication_backend:
              type: intern
          openid_auth_domain:
            http_enabled: true
            transport_enabled: true
            order: 1
            http_authenticator:
              type: openid
              challenge: false
              config:
                subject_key: preferred_username
                roles_key: roles
                jwt_header: Authorization
                openid_connect_url: https://keycloak.azul-infra.svc.cluster.local/realms/azul/.well-known/openid-configuration
                jwt_clock_skew_tolerance_seconds: 30
                openid_connect_idp.enable_ssl: true
                openid_connect_idp.verify_hostnames: true
                openid_connect_idp.pemtrustedcas_filepath: /usr/share/opensearch/config/certs/ca-certificates
            authentication_backend:
              type: noop
        filtered_alias_mode: warn
        do_not_fail_on_forbidden: false
        http:
          anonymous_auth_enabled: false
        authz: {}
        auth_failure_listeners: {}
        multi_rolespan_enabled: true
  topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
kafka:
  enable: true
  name: azul-kafka
  version: 4.2.0
  metadataVersion: 4.2-IV0
  replicas: 3
  resources:
    requests:
      memory: 4Gi
      cpu: 1000m
    limits:
      memory: 6Gi
      cpu: 4000m
  jvmOptions:
    -Xms: 2g
    -Xmx: 2g
  kafkactl:
    enable: false
    image: deviceinsight/kafkactl:v5.13.0-ubuntu
  storage:
    type: persistent-claim
    size: 1Ti
    kraftMetadata: shared
    deleteClaim: false
    class: longhorn
  matchAgentPool: ''
  antiAgentPool: ''
  clusterConfig:
    offsets.topic.replication.factor: 3
    transaction.state.log.replication.factor: 3
    transaction.state.log.min.isr: 2
    auto.create.topics.enable: false
    default.replication.factor: 3
    min.insync.replicas: 2
    num.io.threads: 4
    num.network.threads: 3
    num.partitions: 6
    num.replica.fetchers: 1
    socket.request.max.bytes: 104857600
    unclean.leader.election.enable: false
    message.max.bytes: 4194352
    compression.type: snappy
  topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
keycloak:
  enable: true
  image: registry-1.docker.io/quay.io/keycloak/keycloak:26.1
  replicas: 2
  resources:
    requests:
      memory: 2Gi
      cpu: 500m
    limits:
      memory: 4Gi
      cpu: 2000m
  proxyHeaderArg: xforwarded
  hostnameArg: https://keycloak.internal.au
  extraArgs:
  - --hostname-backchannel-dynamic=true
  tls:
    enabled: true
    secretName: keycloak-internal-tls
    issuerRef:
      name: azul-infra-ca
      kind: Issuer
    duration: 87600h0m0s
    renewBefore: 8760h0m0s
  ingress:
    hostname: keycloak.internal.au
    secretName: keycloak-tls
    annotations:
      cert-manager.io/issuer: azul-infra-ca
      nginx.ingress.kubernetes.io/ssl-redirect: 'true'
      nginx.ingress.kubernetes.io/backend-protocol: HTTPS
  postgres:
    storageClassName: longhorn
    size: 100Gi
    resources:
      requests:
        memory: 2Gi
        cpu: 500m
      limits:
        memory: 4Gi
        cpu: 2000m
    image: registry-1.docker.io/postgres:17.4
kube-prometheus-stack:
  fullnameOverride: kube-prometheus-stack
  enable: false
  namespaceOverride: ''
  alertmanager:
    enabled: false
  defaultRules:
    create: true
    rules:
      alertmanager: true
      etcd: false
      configReloaders: false
      general: true
      k8sContainerCpuUsageSecondsTotal: false
      k8sContainerMemoryCache: false
      k8sContainerMemoryRss: false
      k8sContainerMemorySwap: false
      k8sContainerResource: false
      k8sPodOwner: false
      kubeApiserverAvailability: false
      kubeApiserverBurnrate: false
      kubeApiserverHistogram: false
      kubeApiserverSlos: false
      kubeControllerManager: false
      kubelet: false
      kubeProxy: false
      kubePrometheusGeneral: false
      kubePrometheusNodeRecording: false
      kubernetesApps: true
      kubernetesResources: false
      kubernetesStorage: false
      kubernetesSystem: false
      kubeSchedulerAlerting: false
      kubeSchedulerRecording: false
      kubeStateMetrics: true
      network: false
      node: false
      nodeExporterAlerting: false
      nodeExporterRecording: false
      prometheus: false
      prometheusOperator: false
      windows: false
  grafana:
    enabled: true
    namespaceOverride: ''
    envFromSecret: ''
    notifiers: {}
    admin:
      existingSecret: prometheus-grafana
      userKey: admin-user
      passwordKey: admin-password
    grafana.ini:
      server:
        domain: monitoring.example.com
        root_url: https://monitoring.example.com
      unified_alerting:
        enabled: true
      alerting:
        enabled: false
      auth.basic:
        enabled: true
    defaultDashboardsEnabled: true
    defaultDashboardsTimezone: utc
    persistence:
      type: pvc
      enabled: true
      storageClassName: longhorn
      accessModes:
      - ReadWriteOnce
      size: 10Gi
      finalizers:
      - kubernetes.io/pvc-protection
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        nginx.ingress.kubernetes.io/ssl-redirect: 'true'
        cert-manager.io/cluster-issuer: example-clusterissuer
      labels: {}
      hosts:
      - monitoring.example.com
      path: /
      tls:
      - secretName: monitoring-tls
        hosts:
