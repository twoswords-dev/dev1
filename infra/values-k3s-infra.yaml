certManager:
  enabled: true
  selfSigned: true
  selfSignedIssuerName: azul-infra-selfsigned
  caCertificateName: azul-infra-ca
  caSecretName: azul-infra-ca
  issuerName: azul-infra-ca
operators:
  strimzi:
    enabled: true
  opensearch:
    enabled: true
strimzi-operator:
  replicas: 1
  watchNamespaces:
  - azul-infra
  watchAnyNamespace: false
  labelsExclusionPattern: argocd.argoproj.io/instance
  generateNetworkPolicy: false
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 384Mi
      cpu: 500m
opensearch-operator:
  installCRDs: true
  manager:
    watchNamespace: azul-infra
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 384Mi
        cpu: 500m
  webhook:
    certManager:
      enabled: true
networkPolicy:
  enabled: false
minio:
  main:
    enable: true
    replicas: 1
    storageClass: longhorn
    requests:
      storage: 5Gi
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m
    ingress:
      api:
        enable: true
        host: minio-api.local
      console:
        enable: true
        host: minio.local
      ingressClassName: nginx
      secretName: minio-tls
      annotations:
        cert-manager.io/issuer: azul-infra-ca
        nginx.ingress.kubernetes.io/ssl-redirect: 'true'
  backup:
    enable: false
    replicas: 1
    storageClass: longhorn
    requests:
      storage: 5Gi
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m
    ingress:
      api:
        enable: true
        host: minio-backup-api.local
      console:
        enable: true
        host: minio-backup.local
      ingressClassName: nginx
      secretName: minio-backup-tls
      annotations:
        cert-manager.io/issuer: azul-infra-ca
        nginx.ingress.kubernetes.io/ssl-redirect: 'true'
opensearch:
  enable: true
  name: azul-opensearch
  harden: false
  selfSigned: false
  issuerRef:
    name: azul-infra-ca
    kind: Issuer
  certificateSuffix: azul-infra.svc.cluster.local
  general:
    version: 3.2.0
    replicas: 1
    setVMMaxMapCount: true
  nodes:
    diskSize: 10Gi
    env:
    - name: cluster.initial_master_nodes
      value: azul-opensearch-nodes-0
    - name: discovery.seed_hosts
      value: azul-opensearch-nodes-0
    probes:
      startup:
        command:
        - /bin/bash
        - -c
        - curl -k --silent https://localhost:9200 >/dev/null
      readiness:
        command:
        - /bin/bash
        - -c
        - curl -k --silent https://localhost:9200 >/dev/null
    resources:
      requests:
        memory: 1Gi
        cpu: 500m
      limits:
        memory: 1536Mi
        cpu: 1000m
  ingress:
    enable: false
  dashboard:
    version: 3.2.0
    ingress:
      enable: true
      ingressClassName: nginx
      host: opensearch-dashboards.local
      secretName: dashboard-ingress-tls
      annotations:
        cert-manager.io/issuer: azul-infra-ca
        nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    additionalConfig:
      server.name: azul-opensearch-dashboards
      server.host: 0.0.0.0
      server.rewriteBasePath: 'false'
      opensearch.ssl.verificationMode: certificate
      opensearch.ssl.certificateAuthorities: /usr/share/opensearch-dashboards/config/certs/ca-certificates
      opensearch.requestHeadersWhitelist: '["Authorization", "security_tenant", "securitytenant"]'
      opensearch_security.multitenancy.enabled: 'true'
      opensearch_security.multitenancy.tenants.preferred: '["Private", "Global"]'
      opensearch_security.readonly_mode.roles: '["kibana_read_only"]'
      opensearch_security.cookie.secure: 'true'
      opensearch_security.auth.type: openid
      opensearch_security.openid.scope: openid profile email offline_access roles azul
      # OpenSearch Dashboards fetches OIDC metadata server-side, so use the
      # in-cluster Keycloak service URL. Keycloak still advertises the public
      # issuer/front-channel URLs (https://keycloak.local/...) for browser redirects.
      # Ref: https://docs.opensearch.org/latest/security/authentication-backends/openid-connect/
      opensearch_security.openid.connect_url: https://keycloak.azul-infra.svc.cluster.local/realms/azul/.well-known/openid-configuration
      opensearch_security.openid.client_id: opensearch-dashboards
      opensearch_security.openid.client_secret: ${OPENSEARCH_DASHBOARDS_CLIENT_SECRET}
      opensearch_security.openid.base_redirect_url: https://opensearch-dashboards.local
      # Trust the same cert-manager CA used by Keycloak's internal TLS cert.
      opensearch_security.openid.root_ca: /usr/share/opensearch-dashboards/config/certs/ca-certificates
    additionalVolumes:
    - name: additional-certs
      path: /usr/share/opensearch-dashboards/config/certs
      configMap:
        name: azul-opensearch-certs
      restartPods: true
    env:
    - name: OPENSEARCH_DASHBOARDS_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: opensearch-dashboards-oidc
          key: client-secret
  securityConfig:
    _meta:
      type: config
      config_version: 2
    config:
      dynamic:
        filtered_alias_mode: warn
        do_not_fail_on_forbidden: false
        kibana:
          multitenancy_enabled: true
          private_tenant_enabled: false
          default_tenant: ''
          server_username: kibanaserver
          index: .kibana
          sign_in_options:
          - BASIC
          - OPENID
        http:
          anonymous_auth_enabled: false
        authc:
          basic_internal_auth_domain:
            description: Authenticate via HTTP Basic against internal users database
            http_enabled: true
            transport_enabled: true
            order: 0
            http_authenticator:
              type: basic
              challenge: false
            authentication_backend:
              type: intern
          openid_auth_domain:
            http_enabled: true
            transport_enabled: true
            order: 1
            http_authenticator:
              type: openid
              challenge: false
              config:
                subject_key: preferred_username
                roles_key: roles
                jwt_header: Authorization
                # OpenSearch fetches OIDC metadata/JWKS server-side; keycloak.local
                # is only a browser/ingress DNS name and is not resolvable inside
                # pods, so use the in-cluster Keycloak service URL here.
                # Ref: https://docs.opensearch.org/latest/security/authentication-backends/openid-connect/
                openid_connect_url: https://keycloak.azul-infra.svc.cluster.local/realms/azul/.well-known/openid-configuration
                jwt_clock_skew_tolerance_seconds: 30
                openid_connect_idp.enable_ssl: true
                openid_connect_idp.verify_hostnames: true
                openid_connect_idp.pemtrustedcas_filepath: /usr/share/opensearch/config/certs/ca-certificates
            authentication_backend:
              type: noop
        authz: {}
        auth_failure_listeners: {}
        multi_rolespan_enabled: true
  roleMapping:
    azul-fill1:
      backend_roles:
      - azul_read
      - azul-access
    azul-fill2:
      backend_roles:
      - azul_read
      - azul-access
    azul-fill3:
      backend_roles:
      - azul_read
      - azul-access
    azul-fill4:
      backend_roles:
      - azul_read
      - azul-access
    azul-fill5:
      backend_roles:
      - azul_read
      - azul-access
    s-any:
      backend_roles:
      - azul_read
      - azul-access
    s-official:
      backend_roles:
      - azul_read
      - azul-access
    s-tlp-clear:
      backend_roles:
      - azul_read
      - azul-access
    s-tlp-green:
      backend_roles:
      - azul_read
      - azul-access
    s-tlp-amber:
      backend_roles:
      - azul_read
      - azul-access
    s-tlp-amber-strict:
      backend_roles:
      - azul_read
      - azul-access
    azul_write:
      backend_roles:
      - azul_write
    all_access:
      backend_roles:
      - admin
      - opensearch-admins
kafka:
  enable: true
  name: azul-kafka
  version: 4.2.0
  metadataVersion: 4.2-IV0
  replicas: 1
  resources:
    requests:
      memory: 1Gi
      cpu: 250m
    limits:
      memory: 1536Mi
      cpu: 1000m
  jvmOptions:
    -Xms: 512m
    -Xmx: 512m
  clusterConfig:
    offsets.topic.replication.factor: 1
    transaction.state.log.replication.factor: 1
    transaction.state.log.min.isr: 1
    auto.create.topics.enable: false
    default.replication.factor: 1
    min.insync.replicas: 1
    num.io.threads: 4
    num.network.threads: 3
    num.partitions: 1
    num.replica.fetchers: 1
    socket.request.max.bytes: 104857600
    unclean.leader.election.enable: true
    message.max.bytes: 4194352
    compression.type: snappy
  storage:
    type: persistent-claim
    size: 5Gi
    kraftMetadata: shared
    deleteClaim: false
    class: longhorn
  kafkactl:
    enable: false
keycloak:
  enable: true
  image: quay.io/keycloak/keycloak:26.1
  replicas: 1
  resources:
    requests:
      memory: 512Mi
      cpu: 100m
    limits:
      memory: 1Gi
      cpu: 500m
  proxyHeaderArg: xforwarded
  # Full public URL required when hostname-backchannel-dynamic=true.
  hostnameArg: https://keycloak.local
  # Allows Keycloak to return public front-channel URLs for browsers while
  # still accepting back-channel/server-side requests through the Kubernetes
  # service URL used by OpenSearch/OpenSearch Dashboards.
  extraArgs:
    - --hostname-backchannel-dynamic=true
  tls:
    enabled: true
    secretName: keycloak-internal-tls
    issuerRef:
      name: azul-infra-ca
      kind: Issuer
  ingress:
    hostname: keycloak.local
    secretName: keycloak-tls
    annotations:
      cert-manager.io/issuer: azul-infra-ca
      nginx.ingress.kubernetes.io/ssl-redirect: 'true'
      nginx.ingress.kubernetes.io/backend-protocol: HTTPS
  postgres:
    storageClassName: longhorn
    size: 2Gi
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m
kube-prometheus-stack:
  enable: false
loki:
  enable: false
prometheus-blackbox-exporter:
  enable: false
prometheus-pushgateway:
  enable: false
