{{- if and .Values.certManager.enabled .Values.certManager.selfSigned }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ .Values.certManager.selfSignedIssuerName }}
spec:
  selfSigned: {}

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.certManager.caCertificateName }}
spec:
  secretName: {{ .Values.certManager.caSecretName }}
  duration: {{ .Values.certManager.duration }}
  renewBefore: {{ .Values.certManager.renewBefore }}
  commonName: Azul Infra CA
  isCA: true
  privateKey:
    size: 2048
  usages:
    - digital signature
    - key encipherment
    - cert sign
  issuerRef:
    name: {{ .Values.certManager.selfSignedIssuerName }}
    kind: Issuer

---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ .Values.certManager.issuerName }}
spec:
  ca:
    secretName: {{ .Values.certManager.caSecretName }}
{{- end }}
