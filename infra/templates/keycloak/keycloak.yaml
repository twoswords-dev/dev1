{{- if .Values.keycloak.enable }}
{{- if .Values.keycloak.tls.enabled }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
# Internal Keycloak HTTPS cert; the browser ingress can use a separate TLS secret.
metadata:
  name: keycloak-internal-tls
spec:
  secretName: {{ .Values.keycloak.tls.secretName }}
  duration: {{ .Values.keycloak.tls.duration }}
  renewBefore: {{ .Values.keycloak.tls.renewBefore }}
  privateKey:
    size: 2048
  dnsNames:
    - keycloak
    - keycloak.{{ .Release.Namespace }}
    - keycloak.{{ .Release.Namespace }}.svc
    - keycloak.{{ .Release.Namespace }}.svc.cluster.local
    - keycloak-ha
    - keycloak-ha.{{ .Release.Namespace }}
    - keycloak-ha.{{ .Release.Namespace }}.svc
    - keycloak-ha.{{ .Release.Namespace }}.svc.cluster.local
    - {{ .Values.keycloak.ingress.hostname }}
  usages:
    - key encipherment
    - digital signature
    - server auth
  issuerRef:
{{- if gt (len .Values.keycloak.tls.issuerRef) 0 }}
{{ .Values.keycloak.tls.issuerRef | toYaml | indent 4 }}
{{- else }}
    name: {{ .Values.certManager.issuerName }}
    kind: Issuer
{{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app: keycloak
spec:
  revisionHistoryLimit: 1
  replicas: {{ .Values.keycloak.replicas }}
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
        allow-ingress-keycloak: "true"
        allow-egress-postgres-keycloak: "true"
      {{- with $.Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      containers:
      - name: main
        image: {{ .Values.keycloak.image }}
        args:
          - start
          # Keep Keycloak's advertised hostname aligned with the ingress/OIDC issuer.
          - --hostname={{ .Values.keycloak.hostnameArg | default .Values.keycloak.ingress.hostname }}
          - --proxy-headers={{ .Values.keycloak.proxyHeaderArg }}
{{- range .Values.keycloak.extraArgs }}
          - {{ . | quote }}
{{- end }}
{{- if .Values.keycloak.tls.enabled }}
          - --http-enabled=false
          - --https-certificate-file=/etc/x509/https/tls.crt
          - --https-certificate-key-file=/etc/x509/https/tls.key
{{- else }}
          - --http-enabled=true
{{- end }}
          - --vault-dir=/vault
          - --cache-stack=kubernetes
          # - --log-level=DEBUG
        env:
        - name: jgroups.dns.query
          value: "keycloak-ha"
        - name: KC_DB
          value: "postgres"
        - name: KC_DB_URL
          value: "jdbc:postgresql://postgres:5432/keycloak"
        - name: KC_DB_USERNAME
          value: "keycloak"
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak
              key: DB_PASSWORD
        - name: KC_HEALTH_ENABLED
          value: "true"
        - name: KC_METRICS_ENABLED
          value: "true"
        - name: KEYCLOAK_ADMIN
          value: "admin"
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak
              key: KEYCLOAK_ADMIN_PASSWORD
        # - name: JAVA_OPTS_APPEND
        #   value: >
        #     -Dkeycloak.migration.action=import
        #     -Dkeycloak.migration.provider=dir
        #     -Dkeycloak.migration.dir=/tmp/cfg/
        #     -Dkeycloak.migration.strategy=IGNORE_EXISTING
        ports:
{{- if .Values.keycloak.tls.enabled }}
        - name: https
          containerPort: 8443
{{- else }}
        - name: http
          containerPort: 8080
{{- end }}
        resources:
          {{- toYaml .Values.keycloak.resources | nindent 10 }}
        volumeMounts:
        - name: vault
          mountPath: /vault
{{- if .Values.keycloak.tls.enabled }}
        - name: tls
          mountPath: /etc/x509/https
          readOnly: true
{{- end }}
        # - name: keycloak-data
        #   mountPath: /etc/krb5.conf
        #   subPath: krb5.conf
        # - name: keycloak-data
        #   mountPath: /opt/jboss/keycloak/standalone/configuration/profile.properties
        #   subPath: profile.properties
        # - name: scripts
        #   mountPath: /opt/jboss/startup-scripts/z-enable-vault.cli
        #   subPath: enable-vault.cli
        # - name: scripts
        #   mountPath: /opt/jboss/startup-scripts/z-enable-vault-ha.cli
        #   subPath: enable-vault-ha.cli
          # mount all keycloak data in another directory as well
        # - name: keycloak-data
        #   mountPath: /keycloak-data
        # - name: tls
        #   mountPath: /etc/x509/https
        # - name: keytab
        #   mountPath: /keytab
        # - name: tmp
        #   mountPath: /tmp/cfg
      volumes:
      - name: vault
        secret:
          secretName: keycloak
{{- if .Values.keycloak.tls.enabled }}
      - name: tls
        secret:
          secretName: {{ .Values.keycloak.tls.secretName }}
{{- end }}
      # - name: tmp
      #   emptyDir: {}
      # - name: keycloak-data
      #   configMap:
      #     name: keycloak-data
      # - name: scripts
      #   configMap:
      #     name: keycloak-scripts
      # - name: tls
      #   secret:
      #     secretName: keycloak-tls
      # - name: keytab
      #   secret:
      #     secretName: keycloak-keytab
      #     defaultMode: 0644

---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    app: keycloak
spec:
  ports:
{{- if .Values.keycloak.tls.enabled }}
  - name: https
    port: 443
    targetPort: 8443
{{- else }}
  - name: http
    port: 8080
    targetPort: 8080
{{- end }}
  selector:
    app: keycloak

---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-ha
  labels:
    app: keycloak
spec:
  ports:
{{- if .Values.keycloak.tls.enabled }}
  - name: https
    port: 443
    targetPort: 8443
{{- else }}
  - name: http
    port: 8080
    targetPort: 8080
{{- end }}
  selector:
    app: keycloak
  type: ClusterIP
  clusterIP: None

---
{{- with .Values.keycloak.ingress }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .ingressClassName | default "nginx" }}
  tls:
    - hosts:
        - "{{ .hostname }}"
      secretName: {{ .secretName }}
  rules:
    - host: "{{ .hostname }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
{{- if $.Values.keycloak.tls.enabled }}
                  number: 443
{{- else }}
                  number: 8080
{{- end }}
{{- end }}

{{- end }}
