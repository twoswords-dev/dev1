apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: azul-infra
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: http://192.168.10.150:3002/twoswords/azul-app.git
    targetRevision: main
    path: infra
  destination:
    server: https://kubernetes.default.svc
    namespace: azul-infra
  ignoreDifferences:
    # configure-opensearch-security-azul.sh appends the runtime-generated
    # azul-infra CA into the OpenSearch CA bundle so OpenSearch can validate
    # Keycloak TLS without committing generated CA material.
    - group: ""
      kind: ConfigMap
      name: azul-opensearch-certs
      namespace: azul-infra
      jsonPointers:
        - /data/ca-certificates
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
