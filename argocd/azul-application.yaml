apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: azul
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: http://192.168.10.150:3002/twoswords/azul-app.git
    targetRevision: airgap-2.0
    path: azul
    helm:
      valueFiles:
        - values.yaml
        - values-airgap.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: azul-app
  ignoreDifferences:
    # The local k3s flow appends the runtime-generated azul-infra CA to this
    # ConfigMap after infra is synced. Do not let Argo remove that live CA.
    - group: ""
      kind: ConfigMap
      name: azul-ca-bundle
      namespace: azul-app
      jsonPointers:
        - /data/ca.crt
      jqPathExpressions:
        - '.data["ca.crt"]'
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
